# Firebase App Hosting 설정.
#
# 정적 호스팅이 아니라 App Hosting을 쓰는 이유: /api/ask가 서버에서 돌아야 한다.
# 나머지 화면(홈·둘러보기·스토리 3편)은 전부 빌드 때 미리 그려지므로
# 서버는 AI 안내 요청만 받는다.

runConfig:
  # 평소에는 인스턴스를 띄워 두지 않는다. 첫 요청이 조금 느린 대신 비용이 0이다.
  minInstances: 0
  # 상한. 정치 콘텐츠는 갑자기 몰릴 수 있지만, 몰린다고 요금이 따라 오르면 안 된다.
  # 동시성 80 × 4 = 동시 320건. 모자라면 여기부터 올린다.
  maxInstances: 4
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # 공유 링크와 OG 이미지의 기준 주소. NEXT_PUBLIC_*은 빌드 때 코드에 박히므로
  # BUILD에도 열어 둬야 한다.
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://jamtong.kr
    availability:
      - BUILD
      - RUNTIME

  # AI 안내. 값은 저장소에 두지 않고 Secret Manager를 가리킨다.
  # 코드는 이 이름을 직접 읽지 않는다 — Anthropic SDK가 환경변수에서 집어 간다.
  - variable: ANTHROPIC_API_KEY
    secret: ANTHROPIC_API_KEY
    availability:
      - RUNTIME

  # 위키 질의에 쓸 모델. /api/ask보다 무겁게 간다 — 저쪽은 '어느 화면을
  # 보여줄지' 고르는 일이라 Haiku로 충분하지만, 위키는 여러 장을 읽고
  # 앵커를 그대로 옮겨야 해서 판단이 더 필요하다. 생략하면 ASK_MODEL,
  # 그것도 없으면 claude-haiku-4-5로 내려간다.
  - variable: WIKI_ASK_MODEL
    value: claude-sonnet-5
    availability:
      - RUNTIME

  # 남용 방지 상한. 코드 기본값과 같은 값을 적어 둔다 —
  # 배포 후에 코드를 고치지 않고 여기서 조일 수 있어야 한다.
  - variable: ASK_IP_LIMIT
    value: "20"
    availability:
      - RUNTIME
  - variable: ASK_DAILY_LIMIT
    value: "500"
    availability:
      - RUNTIME

  # 파이어베이스 웹 설정. 브라우저로 그대로 나가는 값이라 비밀이 아니다 —
  # 이 키를 지키는 것은 숨김이 아니라 Firestore 규칙과 승인된 도메인이다.
  # NEXT_PUBLIC_*은 빌드 때 코드에 박히므로 BUILD에 반드시 열어야 한다.
  # 이걸 빠뜨려서 배포본의 MY가 "설정이 없습니다"로 떴다.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyAiOmcgkQN5U0vMkwIvQ90sYVLxtawKeng
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: jamtong.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: jamtong
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: jamtong.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "179902214678"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:179902214678:web:0a0c66a6ff35566eac3b37
    availability:
      - BUILD
      - RUNTIME
