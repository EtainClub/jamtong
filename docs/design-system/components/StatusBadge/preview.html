<!-- @dsCard group="상태" height=208 subtitle="진행 상태와 검증 상태" -->
<style>
  body { margin: 0; padding: 32px; background: var(--eggshell); font-family: var(--font-ui); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .cap { margin: 0 0 10px; color: var(--ash); font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em; }
  .badge { padding: 5px 12px; border-radius: var(--radius-pill); font-size: 12px; font-weight: 600; line-height: 1.5; }
  .done { background: var(--ink); color: var(--eggshell); }
  .ongoing { background: var(--taupe); color: var(--graphite); box-shadow: inset 0 0 0 1px var(--stone); }
  .planned { background: transparent; color: var(--smoke); box-shadow: inset 0 0 0 1px var(--stone); }
  .pending { background: var(--pending-tint); color: var(--pending); }
  .tag { padding: 5px 12px; border-radius: var(--radius-pill); background: var(--taupe); color: var(--smoke); font-size: 12px; }
  .card { margin-top: 28px; padding: 24px; border: 1px solid var(--pending); border-radius: var(--radius-card); background: var(--eggshell); }
  .title { margin: 14px 0 0; color: var(--ink); font-size: 18px; font-weight: 500; }
</style>

<p class="cap">진행 상태 — 채움과 테두리로 구분, 색은 쓰지 않는다</p>
<div class="row">
  <span class="badge done">완료</span>
  <span class="badge ongoing">추진 중</span>
  <span class="badge planned">계획</span>
  <span class="tag">경제·물류</span>
</div>

<div class="card">
  <div class="row">
    <span class="badge planned">계획</span>
    <span class="badge pending">검증 전</span>
  </div>
  <p class="title">미검증 항목은 테두리로도 구분합니다</p>
</div>
