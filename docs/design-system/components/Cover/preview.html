<!-- @dsCard height=312 -->
<style>
  body { margin: 0; background: var(--eggshell); font-family: var(--font-ui); }
  .wrap { width: 960px; height: 312px; }
  svg { display: block; width: 960px; height: 312px; }
  .slab  { fill: var(--taupe); }
  .navy  { fill: var(--navy); }
  .tint  { fill: var(--navy-tint); }
  .burg  { fill: var(--burgundy); }
  .ink   { fill: var(--ink); }
  .name  { fill: var(--ink); font-family: var(--font-display); font-size: 120px; font-weight: 300; letter-spacing: -0.03em; }
  .tag   { fill: var(--smoke); font-size: 14px; font-weight: 400; }
</style>

<!--
  블록: taupe 슬래브 424×224 · navy 272×32 · burgundy 352×32 · navy-tint 200×32 · ink 120×32
  배치: 오른쪽 상자(x=496~920) 안, 길이가 제각각인 알약을 왼쪽 정렬로 쌓았다.
        이 제품이 논증하는 방식 그대로다 — 나란히 놓아야 차이가 보인다.
  패턴: 알약. 이 시스템에서 누를 수 있는 것과 값을 나타내는 것이 전부 radius-pill이고,
        길이가 다른 알약의 더미는 곧 비교 막대다. 같은 길이로 줄세우면 스와치 표가 된다.
  스케일: 변 424/352/272/224/200/120/32 = space-2(8) 배수 · 간격 space-4(16) ·
          모서리 radius-card-lg(24)와 radius-pill(짧은 변의 절반 16).
-->
<div class="wrap">
  <svg viewBox="0 0 960 312" role="img" aria-label="잼통 디자인 시스템 표지">
    <rect class="slab" x="496" y="48"  width="424" height="224" rx="24" />
    <rect class="navy" x="528" y="80"  width="272" height="32" rx="16" />
    <rect class="burg" x="528" y="128" width="352" height="32" rx="16" />
    <rect class="tint" x="528" y="176" width="200" height="32" rx="16" />
    <rect class="ink"  x="528" y="224" width="120" height="32" rx="16" />

    <text class="name" x="48" y="196">잼통</text>
    <text class="tag"  x="52" y="230">읽는 위키가 아니라 이해하는 위키</text>
  </svg>
</div>
