<!-- @dsCard group="근거" height=140 subtitle="근거 칩" -->
<style>
  body {
    margin: 0; padding: 32px;
    background: var(--eggshell);
    font-family: var(--font-ui);
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 14px;
    border: 1px solid var(--stone);
    border-radius: var(--radius-pill);
    background: var(--eggshell);
    color: var(--graphite);
    font-size: 13px; font-weight: 500; line-height: 1.5;
    cursor: pointer;
  }
  .chip:hover { border-color: var(--graphite); }
  .dot { width: 5px; height: 5px; border-radius: var(--radius-pill); background: var(--navy); }
  .badge {
    padding: 5px 12px;
    border-radius: var(--radius-pill);
    background: var(--pending-tint);
    color: var(--pending);
    font-size: 11px; font-weight: 600;
  }
  .cap {
    width: 100%; margin: 0 0 4px;
    color: var(--ash); font-family: var(--font-mono);
    font-size: 11px; letter-spacing: .04em;
  }
</style>

<p class="cap">기본 · 라벨 있음 · 검증 전과 나란히</p>
<button class="chip"><span class="dot"></span>근거 2건</button>
<button class="chip"><span class="dot"></span>최단거리 항로 · 근거 1건</button>
<button class="chip"><span class="dot"></span>근거 1건</button>
<span class="badge">검증 전</span>
