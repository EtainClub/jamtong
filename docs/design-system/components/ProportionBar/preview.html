<!-- @dsCard group="데이터" height=280 subtitle="비교 막대와 누적 막대" -->
<style>
  body { margin: 0; padding: 32px; background: var(--eggshell); font-family: var(--font-ui); }
  .cap { margin: 0 0 14px; color: var(--ash); font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em; }
  .row { margin-bottom: 16px; }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  .name { font-size: 14px; font-weight: 500; color: var(--graphite); }
  .val { color: var(--smoke); font-family: var(--font-mono); font-size: 13px; font-variant-numeric: tabular-nums; }
  .val b { color: var(--ink); font-weight: 400; }
  .track { margin-top: 8px; height: 10px; border-radius: var(--radius-pill); background: var(--taupe); overflow: hidden; }
  .fill { height: 100%; border-radius: var(--radius-pill); }
  .solid { background: var(--navy); }
  .hatch {
    background: repeating-linear-gradient(-45deg, var(--burgundy) 0 3px, var(--burgundy-tint) 3px 7px);
  }
  .stack { display: flex; height: 40px; border-radius: var(--radius-sm); overflow: hidden; margin-top: 8px; border: 1px solid var(--stone); }
  .seg { display: grid; place-items: center; font-family: var(--font-mono); font-size: 12px; font-variant-numeric: tabular-nums; }
  .note { margin: 20px 0 0; color: var(--smoke); font-size: 14px; line-height: 1.5; }
</style>

<p class="cap">비교 — 길이는 값에 정비례 · 주인공은 채움, 비교군은 빗금</p>
<div class="row">
  <div class="head"><span class="name">북극항로</span><span class="val"><b>13,000 km</b> · 20~24일</span></div>
  <div class="track"><div class="fill solid" style="width: 54%"></div></div>
</div>
<div class="row">
  <div class="head"><span class="name">수에즈 운하</span><span class="val"><b>20,400 km</b> · 30~34일</span></div>
  <div class="track"><div class="fill hatch" style="width: 85%"></div></div>
</div>
<div class="row">
  <div class="head"><span class="name">희망봉</span><span class="val"><b>24,000 km</b> · 36~40일</span></div>
  <div class="track"><div class="fill hatch" style="width: 100%"></div></div>
</div>

<p class="cap" style="margin-top: 26px">누적 — 한 전체의 구성</p>
<div class="stack">
  <div class="seg" style="width: 53.5%; background: var(--navy); color: var(--eggshell)">53.5%</div>
  <div class="seg" style="width: 45.6%; background: var(--navy-tint); color: var(--navy)">45.6%</div>
  <div class="seg" style="width: 0.9%; background: var(--burgundy)"></div>
</div>

<p class="note">78,000톤 선박, 7~10월 기준 분석값입니다. 전제를 숨기고 수치만 보여주면 오도가 됩니다.</p>
