<title>잼공 시안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 넓은 화면은 [휴대폰 시안 | 설계 메모] 두 칸, 좁은 화면은 시안 아래 메모.
   느낌: 잼공 = 공부방 느낌, 모눈 공책(밝음) / 칠판(어두움). 잼통이의 잼 호박색이 유일한 강조색. */
:root {
  --bg: #e9efec;          /* 책상 */
  --paper: #fbfcfa;       /* 공책 */
  --grid: #dbe6e1;        /* 모눈 */
  --ink: #1f3a35;         /* 칠판 먹색 */
  --muted: #5c726c;
  --line: #cfdcd6;
  --board: #24443d;       /* 칠판 */
  --board-ink: #eef5ef;
  --jam: #d97a22;         /* 잼 */
  --jam-soft: #fbe7cf;
  --jam-ink: #7a3f0c;
  --ok: #2f8a57;
  --ok-soft: #dcf1e3;
  --hmm: #b7791f;
  --hmm-soft: #fbefd6;
  --fact: #2f8a57;
  --claim: #c0711b;
  --interp: #3b6fb0;
  --opinion: #7d5aa8;
  --counter: #8a4fa0;
  --display: "Jua", "IBM Plex Sans KR", system-ui, sans-serif;
  --body: "IBM Plex Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121c1a; --paper: #1a2a27; --grid: #22352f; --ink: #e6f0ea; --muted: #9db3ab; --line: #2f4741;
    --board: #0f1f1b; --board-ink: #e6f0ea; --jam: #f09a45; --jam-soft: #3d2a17; --jam-ink: #ffd6a8;
    --ok: #5cc48a; --ok-soft: #1c3a2a; --hmm: #e6ac4f; --hmm-soft: #3a2e17;
    --fact: #5cc48a; --claim: #f0a050; --interp: #7fa8e0; --opinion: #b496dc; --counter: #c592d8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121c1a; --paper: #1a2a27; --grid: #22352f; --ink: #e6f0ea; --muted: #9db3ab; --line: #2f4741;
  --board: #0f1f1b; --board-ink: #e6f0ea; --jam: #f09a45; --jam-soft: #3d2a17; --jam-ink: #ffd6a8;
  --ok: #5cc48a; --ok-soft: #1c3a2a; --hmm: #e6ac4f; --hmm-soft: #3a2e17;
  --fact: #5cc48a; --claim: #f0a050; --interp: #7fa8e0; --opinion: #b496dc; --counter: #c592d8;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); line-height: 1.55; }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--jam); outline-offset: 2px; }
.page { max-width: 1080px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 16px; }
.page-head h1 { font-family: var(--display); font-weight: 400; font-size: 28px; margin: 0; }
.page-head p { margin: 0; color: var(--muted); font-size: 13px; }
.tag { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--jam-soft); color: var(--jam-ink); }
.stage { display: grid; grid-template-columns: minmax(0, 400px) minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 880px) { .stage { grid-template-columns: minmax(0, 1fr); } }

/* ── 휴대폰 ─────────────────────────────── */
.phone { position: relative; width: 100%; max-width: 400px; height: 780px; margin: 0 auto;
  background: var(--paper); border: 1px solid var(--line); border-radius: 30px; overflow: hidden;
  display: flex; flex-direction: column; box-shadow: 0 18px 40px -18px #1f3a3555; }
@media (max-width: 880px) { .phone { height: min(780px, 86dvh); } }
.site-nav-note { font-size: 10.5px; color: var(--muted); text-align: center; padding: 4px 0 0; }
.appbar { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px; background: var(--board); color: var(--board-ink); }
.appbar .back { font-size: 11px; opacity: .8; border: 1px solid #ffffff30; border-radius: 999px; padding: 2px 8px; background: none; color: inherit; }
.appbar h2 { font-family: var(--display); font-weight: 400; font-size: 19px; margin: 0; flex: 1; letter-spacing: -.01em; }
.chip-stat { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: #ffffff18; }
.segs { display: flex; gap: 6px; padding: 8px 12px; background: var(--board); overflow-x: auto; scrollbar-width: none; }
.segs button { flex-shrink: 0; border: 1px solid #ffffff2a; background: none; color: var(--board-ink); opacity: .75; border-radius: 999px; padding: 4px 12px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
.segs button[aria-pressed="true"] { background: var(--board-ink); color: var(--board); opacity: 1; }
.screen { flex: 1; overflow-y: auto; padding: 14px 14px 22px; display: flex; flex-direction: column; gap: 12px;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px; background-position: -1px -1px; }
.tabs { display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--line); background: var(--paper); }
.tabs button { border: 0; background: none; padding: 7px 0 9px; display: grid; justify-items: center; gap: 1px; font-size: 10.5px; font-weight: 600; color: var(--muted); cursor: pointer; }
.tabs button .ico { font-size: 19px; line-height: 1.2; filter: grayscale(.6); }
.tabs button[aria-current="page"] { color: var(--ink); }
.tabs button[aria-current="page"] .ico { filter: none; transform: translateY(-1px); }

/* 공통 블록 */
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
.eyebrow { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; color: var(--muted); }
.h { font-family: var(--display); font-weight: 400; font-size: 17px; margin: 2px 0 4px; }
.small { font-size: 12px; color: var(--muted); }
.row { display: flex; align-items: center; gap: 10px; }
.btn { border: 0; border-radius: 14px; padding: 10px 14px; font-weight: 700; cursor: pointer; }
.btn-jam { background: var(--jam); color: #fff; box-shadow: 0 4px 0 color-mix(in srgb, var(--jam) 60%, #000); }
.btn-jam:active { transform: translateY(3px); box-shadow: 0 1px 0 color-mix(in srgb, var(--jam) 60%, #000); }
.btn-line { background: var(--paper); border: 1px solid var(--line); }
.btn[disabled] { opacity: .45; cursor: not-allowed; box-shadow: none; }
.link { color: var(--jam-ink); font-weight: 600; font-size: 12px; text-decoration: underline; text-underline-offset: 2px; }
:root[data-theme="dark"] .link { color: var(--jam); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .link { color: var(--jam); } }

/* 잼통이 + 말풍선 */
.greet { display: flex; gap: 10px; align-items: flex-end; }
.bubble { position: relative; background: var(--paper); border: 1px solid var(--line); border-radius: 16px 16px 16px 4px; padding: 9px 12px; font-size: 13.5px; flex: 1; min-width: 0; }
.jt { flex-shrink: 0; }
.jt.hop { animation: hop .6s ease-out; }
@keyframes hop { 0%,100% { transform: translateY(0) } 35% { transform: translateY(-14px) scale(1.04, .96) } 60% { transform: translateY(0) scale(.96, 1.04) } }
@media (prefers-reduced-motion: reduce) { .jt.hop { animation: none; } }

/* 출석 */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 8px; }
.day { display: grid; justify-items: center; gap: 2px; font-size: 10.5px; color: var(--muted); }
.stamp { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; border: 1.5px dashed var(--line); background: var(--paper); }
.stamp.on { border: 2px solid var(--jam); background: var(--jam-soft); }
.stamp.rest { border-style: solid; color: var(--muted); font-weight: 700; }
.stamp.today { outline: 2px solid var(--ink); outline-offset: 2px; }

.cta { background: var(--board); color: var(--board-ink); border-radius: 18px; padding: 14px; display: grid; gap: 10px; }
.cta .btn-jam { width: 100%; font-size: 16px; padding: 13px; }
.meta-row { display: flex; flex-wrap: wrap; gap: 6px; font-size: 11.5px; }
.meta-row span { background: #ffffff16; border-radius: 999px; padding: 2px 8px; }

.progress { height: 8px; border-radius: 999px; background: var(--grid); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--ok); border-radius: inherit; transition: width .35s ease; }

/* 근거 카드 */
.ev { border: 1px solid var(--line); border-left: 5px solid var(--t, var(--fact)); border-radius: 12px; padding: 10px 12px; background: var(--paper); display: grid; gap: 6px; }
.ev .kind { font-size: 10.5px; font-weight: 700; color: var(--t); letter-spacing: .02em; }
.ev p { margin: 0; font-size: 13px; }
.ev .anchor { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; color: var(--muted); word-break: break-all; }
.t-fact { --t: var(--fact); } .t-claim { --t: var(--claim); } .t-interp { --t: var(--interp); } .t-opinion { --t: var(--opinion); } .t-counter { --t: var(--counter); }

/* 길 지도 */
.course-chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.course-chips button { flex-shrink: 0; border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 5px 11px; font-size: 12px; font-weight: 600; cursor: pointer; }
.course-chips button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.path { position: relative; padding: 6px 0 10px; }
.path svg.trail { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.node { position: relative; display: flex; align-items: center; gap: 10px; margin: 0 0 18px; }
.node:nth-child(4n+2) { padding-left: 64px; } .node:nth-child(4n+3) { padding-left: 120px; } .node:nth-child(4n+4) { padding-left: 64px; }
.node button { width: 58px; height: 58px; border-radius: 50%; border: 0; display: grid; place-items: center; font-size: 25px; cursor: pointer; flex-shrink: 0;
  background: var(--paper); box-shadow: 0 5px 0 var(--line), inset 0 0 0 2px var(--line); }
.node.fruit button { background: var(--jam-soft); box-shadow: 0 5px 0 color-mix(in srgb, var(--jam) 55%, transparent), inset 0 0 0 2px var(--jam); }
.node.bloom button, .node.sprout button { background: var(--ok-soft); box-shadow: 0 5px 0 color-mix(in srgb, var(--ok) 45%, transparent), inset 0 0 0 2px var(--ok); }
.node.now button { background: var(--jam); color: #fff; box-shadow: 0 5px 0 color-mix(in srgb, var(--jam) 60%, #000); animation: pulse 2s ease-in-out infinite; }
.node.locked button { filter: grayscale(1); opacity: .5; cursor: default; }
@keyframes pulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.06) } }
@media (prefers-reduced-motion: reduce) { .node.now button { animation: none; } }
.node .lbl { font-size: 12.5px; font-weight: 600; line-height: 1.3; min-width: 0; }
.node .lbl small { display: block; font-weight: 500; color: var(--muted); font-size: 11px; }

.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.field { text-align: left; }
.field .plants { font-size: 18px; letter-spacing: 2px; }

/* 대화 */
.chat { display: grid; gap: 8px; }
.msg { max-width: 85%; padding: 9px 12px; border-radius: 16px; font-size: 13.5px; }
.msg.them { background: var(--paper); border: 1px solid var(--line); border-radius: 16px 16px 16px 4px; }
.msg.me { justify-self: end; background: var(--jam-soft); color: var(--ink); border-radius: 16px 16px 4px 16px; }
.msg .who { font-size: 10.5px; font-weight: 700; color: var(--muted); display: block; margin-bottom: 2px; }
.pick { display: grid; gap: 6px; }
.pick button { text-align: left; border: 1.5px solid var(--line); background: var(--paper); border-radius: 12px; padding: 8px 10px; font-size: 12.5px; cursor: pointer; display: flex; gap: 8px; align-items: flex-start; }
.pick button[aria-pressed="true"] { border-color: var(--jam); background: var(--jam-soft); }
.pick .k { flex-shrink: 0; font-size: 10px; font-weight: 700; color: var(--t); border: 1px solid var(--t); border-radius: 6px; padding: 0 5px; margin-top: 2px; }
.verdict { border-radius: 12px; padding: 10px 12px; font-size: 12.5px; display: grid; gap: 4px; }
.verdict.good { background: var(--ok-soft); }
.verdict.hint { background: var(--hmm-soft); }

/* 레슨 오버레이 */
.overlay { position: absolute; inset: 0; background: var(--paper); display: flex; flex-direction: column; z-index: 5; }
.lesson-top { display: flex; align-items: center; gap: 10px; padding: 14px 14px 6px; }
.lesson-top .x { border: 0; background: none; font-size: 20px; cursor: pointer; color: var(--muted); }
.lesson-top .progress { flex: 1; height: 12px; }
.streakfire { font-size: 12px; font-weight: 700; color: var(--jam-ink); min-width: 34px; text-align: right; }
.lesson-body { flex: 1; overflow-y: auto; padding: 10px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.qtype { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
.qtext { font-size: 17px; font-weight: 700; line-height: 1.45; margin: 0; text-wrap: balance; }
.opts { display: grid; gap: 8px; }
.opts.ox { grid-template-columns: 1fr 1fr; }
.opt { border: 2px solid var(--line); background: var(--paper); border-radius: 14px; padding: 12px; font-size: 14px; text-align: left; cursor: pointer; box-shadow: 0 3px 0 var(--line); }
.opts.ox .opt { font-size: 30px; text-align: center; padding: 16px 0; }
.opt[aria-pressed="true"] { border-color: var(--interp); background: color-mix(in srgb, var(--interp) 12%, var(--paper)); box-shadow: 0 3px 0 var(--interp); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); box-shadow: 0 3px 0 var(--ok); }
.opt.wrong { border-color: var(--hmm); background: var(--hmm-soft); box-shadow: 0 3px 0 var(--hmm); }
.lesson-foot { padding: 12px 16px 16px; border-top: 1px solid var(--line); display: grid; gap: 10px; }
.lesson-foot.good { background: var(--ok-soft); border-color: transparent; }
.lesson-foot.hint { background: var(--hmm-soft); border-color: transparent; }
.fb-title { font-family: var(--display); font-size: 18px; display: flex; align-items: center; gap: 8px; }
.fb-text { font-size: 13px; margin: 0; }
.lesson-foot .btn { width: 100%; padding: 13px; font-size: 15px; }
.btn-ok { background: var(--ok); color: #fff; box-shadow: 0 4px 0 color-mix(in srgb, var(--ok) 60%, #000); }

.done { align-items: center; text-align: center; }
.earned { display: grid; gap: 8px; width: 100%; text-align: left; }
.reward { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.reward span { background: var(--jam-soft); color: var(--jam-ink); font-weight: 700; font-size: 12px; border-radius: 999px; padding: 4px 10px; }
:root[data-theme="dark"] .reward span { color: var(--jam); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .reward span { color: var(--jam); } }

/* 시트 */
.sheet-wrap { position: absolute; inset: 0; background: #0006; display: flex; align-items: flex-end; z-index: 6; }
.sheet { width: 100%; background: var(--paper); border-radius: 22px 22px 0 0; padding: 16px; display: grid; gap: 10px; max-height: 85%; overflow-y: auto; }
.lock { background: linear-gradient(160deg, #2b3d52, #182634); color: #f1f5f9; border-radius: 16px; padding: 14px; display: grid; gap: 8px; }
.lock .time { font-family: var(--display); font-size: 30px; text-align: center; }
.noti { background: #ffffff22; border-radius: 12px; padding: 8px 10px; font-size: 12px; display: grid; gap: 1px; }
.noti b { font-size: 12.5px; }
.steps5 { display: grid; gap: 6px; }
.steps5 div { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; border: 1px solid var(--line); font-size: 13px; }
.steps5 .st { margin-left: auto; font-size: 11px; color: var(--muted); }
.steps5 .doneS { background: var(--ok-soft); border-color: transparent; }
.steps5 .nowS { background: var(--jam-soft); border-color: var(--jam); }

/* 달력 */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: 11px; }
.cal .dname { color: var(--muted); font-weight: 600; }
.cal .c { aspect-ratio: 1; max-width: 100%; display: grid; place-items: center; border-radius: 10px; font-variant-numeric: tabular-nums; }
.cal .c.on { background: var(--jam-soft); font-size: 15px; }
.cal .c.rest { color: var(--muted); font-weight: 700; background: var(--grid); }
.cal .c.today { outline: 2px solid var(--ink); }
.badges { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.badge { text-align: center; font-size: 11.5px; padding: 10px 6px; }
.badge .b { font-size: 26px; display: block; }
.badge.off { opacity: .45; filter: grayscale(1); }
.setting { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.setting:last-child { border-bottom: 0; }
.seg3 { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg3 button { border: 0; background: var(--paper); padding: 5px 9px; font-size: 12px; cursor: pointer; }
.seg3 button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.toggle { width: 42px; height: 24px; border-radius: 999px; border: 0; background: var(--line); position: relative; cursor: pointer; flex-shrink: 0; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left .2s; }
.toggle[aria-checked="true"] { background: var(--ok); }
.toggle[aria-checked="true"]::after { left: 21px; }
.search { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; background: var(--paper); color: var(--ink); font: inherit; font-size: 13px; }
.list { display: grid; gap: 8px; }
.item { display: flex; gap: 10px; align-items: flex-start; }
.item .ic { font-size: 20px; line-height: 1.2; }
.item p { margin: 0; font-size: 13px; }
.timer { font-family: var(--display); font-size: 40px; text-align: center; font-variant-numeric: tabular-nums; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; padding: 6px 0; }
.check input { margin-top: 3px; accent-color: var(--ok); }
.toast { position: absolute; left: 50%; bottom: 76px; transform: translateX(-50%); background: var(--ink); color: var(--paper); font-size: 12.5px; padding: 7px 14px; border-radius: 999px; z-index: 9; white-space: nowrap; }

/* ── 설계 메모 ─────────────────────────── */
.notes { display: grid; gap: 14px; min-width: 0; }
.notes section { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; }
.notes h3 { font-family: var(--display); font-weight: 400; font-size: 19px; margin: 0 0 6px; }
.notes h4 { font-size: 13px; margin: 12px 0 4px; }
.notes p, .notes li { font-size: 13.5px; max-width: 65ch; }
.notes ul { padding-left: 18px; margin: 4px 0; }
.notes .where { font-size: 11px; font-weight: 700; color: var(--jam-ink); letter-spacing: .06em; }
:root[data-theme="dark"] .notes .where { color: var(--jam); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .notes .where { color: var(--jam); } }
.navcmp { overflow-x: auto; }
.navcmp table { border-collapse: collapse; font-size: 12.5px; width: 100%; min-width: 340px; }
.navcmp td, .navcmp th { border: 1px solid var(--line); padding: 5px 6px; text-align: center; }
.navcmp th { font-size: 11px; color: var(--muted); font-weight: 600; text-align: left; }
.navcmp .new { background: var(--jam-soft); font-weight: 700; }
.map { overflow-x: auto; }
.map table { border-collapse: collapse; font-size: 12.5px; width: 100%; min-width: 420px; }
.map td, .map th { border-bottom: 1px solid var(--line); padding: 6px 6px; text-align: left; vertical-align: top; }
.map th { font-size: 11px; color: var(--muted); }
</style>

<div class="page">
  <header class="page-head">
    <h1>잼공</h1>
    <span class="tag">시안 · 예시 데이터</span>
    <p>재밌는 공부, 잼통 공부. 하단 탭 「위키」 자리에 들어가는 매일 공부 앱. 탭과 버튼을 눌러 보세요. 레슨과 대화 연습은 실제로 풀립니다.</p>
  </header>

  <div class="stage">
    <div>
      <div class="phone" id="phone">

    "<b>대화 연습</b> — 친구 메시지(정책의 도는 말 요약) → 근거 카드 2~3장 고르기 → 답장 완성 → 원본 링크와 함께 복사. 정답이 하나가 아니고 '꼭 넣을 카드'와 '넣으면 좋은 카드'가 있다.",

    "<b>30초 설명</b> — 열매가 된 단원을 소리 내어 설명하고 네 칸(무엇·사실과 주장·출처·반론)을 스스로 짚는다. 녹음·AI 채점 없음.",
    "답장은 카드에 딸린 <code>say</code>(근거 문장을 말투만 바꾼 것)를 이어 붙인다. 모델 호출이 없다." ] },
  note: { title: "📒 근거노트", why: "논쟁 직전에 꺼내 보는 곳. 익힌 것이 쌓여 내 무기가 된다.", items: [
    "<b>근거 카드</b> — 사실·주장·해석·의견·반론을 색으로 나눈다. 검색, 복사, 원문 보기. 앵커만 저장해 원본이 고쳐지면 따라 바뀐다.",
    "<b>다시 볼 것</b> — 틀린 문제와 상자(1~5) 일정. 오늘의 한 판에 자동으로 섞인다.",
    "<b>용어장</b> — 언행 glossary + 레슨에서 만난 낱말." ] },
  me: { title: "🌼 내 기록", why: "꾸준함을 나만 본다. 정원과 이어지는 문.", items: [
    "<b>출석부</b> — 달력 도장, 쉼표(주 2개 자동). 끊겨도 꾸짖지 않는다.",
    "<b>꽃밭·배지</b> — 정원으로 가는 보상(하루 상한), 알아낸 것으로만 주는 배지.",
    "<b>설정·알림</b> — 하루 목표, 공부 알림(시각·잠금 화면 숨김). 알림은 하루 한 번이 최대, 목표를 채운 날은 오지 않는다." ] },
};

function renderNotes() {
  const n = NOTES[state.tab];
  $("#notes").innerHTML = `
  <section>
    <div class="where">지금 보는 탭</div>
    <h3>${n.title}</h3>
    <p>${n.why}</p>
    <ul>${n.items.map(i => `<li>${i}</li>`).join("")}</ul>
  </section>
  <section>
    <h3>앱 지도</h3>
    <div class="map"><table>
      <thead><tr><th>탭</th><th>칸</th><th>매일 쓰는 이유</th></tr></thead>
      <tbody>
        <tr><td>🏫 교실</td><td>오늘 · 알림장</td><td>오늘의 한 판, 이어 하기</td></tr>
        <tr><td>🗺️ 배움길</td><td>길 · 분야 지도</td><td>다음 단원, 내가 아는 범위</td></tr>
        <tr><td>💬 말하기</td><td>대화 연습 · 도는 말 · 30초 설명</td><td>근거로 답하는 연습</td></tr>
        <tr><td>📒 근거노트</td><td>근거 카드 · 다시 볼 것 · 용어장</td><td>논쟁 직전에 꺼내 보기</td></tr>
        <tr><td>🌼 내 기록</td><td>출석부 · 꽃밭·배지 · 설정·알림</td><td>꾸준함, 정원 보상</td></tr>
      </tbody></table></div>
  </section>
  <section>
    <h3>사이트 하단 탭</h3>
    <div class="navcmp"><table>
      <tr><th>지금</th><td>홈</td><td>위키</td><td>업적</td><td>언행</td><td>정원</td></tr>
      <tr><th>바뀐 뒤</th><td>홈</td><td class="new">잼공</td><td>업적</td><td>언행</td><td>정원</td></tr>
    </table></div>
    <p>위키는 <b>업적 탭</b>이 자기 것으로 치고(<code>owns: ["/wiki"]</code>), 상단 메뉴와 홈에서도 들어간다. 위키의 AI 질문은 교실의 「잼통이에게 묻기」로도 쓸 수 있다.</p>
  </section>`;
}

function render() {
  renderChrome();
  $("#screen").innerHTML = (SCREENS[state.seg] || SCREENS.today)();
  renderNotes();
}

/* ───────── 레슨 ───────── */
let L = null;
function openLesson() {
  L = { i: 0, sel: null, checked: false, right: 0, combo: 0 };
  const o = document.createElement("div"); o.className = "overlay"; o.id = "lesson"; o.setAttribute("role", "dialog"); o.setAttribute("aria-label", "오늘의 한 판");
  $("#phone").appendChild(o); drawLesson();
}
function closeLesson() { $("#lesson")?.remove(); L = null; }
function drawLesson() {
  const o = $("#lesson"); if (!o) return;
  if (L.i >= LESSON.length) return drawDone(o);
  const q = LESSON[L.i];
  const pct = Math.round((L.i + (L.checked ? 1 : 0)) / LESSON.length * 100);
  const ok = L.checked && L.sel === q.answer;
  const opts = q.ox ? ["⭕", "❌"] : q.opts;
  o.innerHTML = `
    <div class="lesson-top"><button class="x" type="button" data-act="quit" aria-label="그만두기">✕</button><div class="progress"><i style="width:${pct}%"></i></div><span class="streakfire">${L.combo >= 2 ? "🔥" + L.combo : ""}</span></div>
    <div class="lesson-body">
      <div class="qtype">${q.type} · ${q.unit}</div>
      <p class="qtext">${esc(q.q)}</p>
      <div class="opts ${q.ox ? "ox" : ""}">${opts.map((t, i) => {
        let cls = ""; if (L.checked) { if (i === q.answer) cls = "right"; else if (i === L.sel) cls = "wrong"; }
        return `<button type="button" class="opt ${cls}" data-opt="${i}" aria-pressed="${L.sel === i}" ${L.checked ? "disabled" : ""} aria-label="${q.ox ? (i === 0 ? "맞다(O)" : "아니다(X)") : esc(t)}">${esc(t)}</button>`;
      }).join("")}</div>
      ${L.checked ? "" : `<div class="greet" style="margin-top:auto">${jam("think", 44)}<div class="bubble">근거는 언제나 원본 claim에서 와요. 틀려도 막히지 않아요.</div></div>`}
    </div>
    <div class="lesson-foot ${L.checked ? (ok ? "good" : "hint") : ""}">
      ${L.checked ? `
        <div class="fb-title">${jam(ok ? "cheer" : "smile", 30)} ${ok ? "맞았어요!" : "같이 볼까요?"}</div>
        <p class="fb-text">${esc(q.explain)}</p>
        <div class="row" style="flex-wrap:wrap"><span class="ev-anchor small" style="font-family:ui-monospace,monospace">^[${esc(q.a)}]</span><a class="link" href="${q.href}" target="_blank" rel="noopener">원문 보기</a></div>
        <button class="btn ${ok ? "btn-ok" : "btn-jam"}" type="button" data-act="next">계속</button>`
      : `<button class="btn btn-jam" type="button" data-act="check" ${L.sel === null ? "disabled" : ""}>확인</button>`}
    </div>`;
  if (L.checked && ok) o.querySelector(".fb-title .jt")?.classList.add("hop");
}
function drawDone(o) {
  o.innerHTML = `
    <div class="lesson-top"><button class="x" type="button" data-act="quit" aria-label="닫기">✕</button><div class="progress"><i style="width:100%"></i></div><span class="streakfire"></span></div>
    <div class="lesson-body done">
      ${jam("cheer", 92).replace('class="jt"', 'class="jt hop"')}
      <div class="h" style="font-size:22px">오늘의 한 판 끝!</div>
      <p class="small" style="margin:0">${LESSON.length}문제 중 ${L.right}개를 바로 맞혔어요. 틀린 건 다시 볼 것에 들어갔어요.</p>
      <div class="reward"><span>🫙 오늘 도장</span><span>🍯 +30 (정원)</span><span>💧 물뿌리개 1</span></div>
      <div class="earned"><div class="eyebrow">오늘 근거노트에 들어간 카드</div>${[WALLET[0], WALLET[2], WALLET[4]].map(c => evCard(c)).join("")}</div>
    </div>
    <div class="lesson-foot"><button class="btn btn-jam" type="button" data-act="afterDone">좋아요</button></div>`;
}

/* 알림 묻기 시트 — 첫 판을 마친 뒤에 한 번 */
function pushSheet(preview) {
  const w = document.createElement("div"); w.className = "sheet-wrap"; w.id = "sheet";
  const body = state.neutral ? "오늘의 한 판(약 4분)이 준비됐어요" : "대장동 반론 단계 · 다시 볼 카드 4장";
  w.innerHTML = `<div class="sheet" role="dialog" aria-label="공부 알림">
    <div class="greet">${jam("smile", 46)}<div class="bubble">${preview ? "알림은 이렇게 와요." : `내일도 잊지 않게 <b>저녁 ${state.pushHour}시</b>에 한 번만 알려 드릴까요?`}</div></div>
    <div class="lock"><div class="time">${state.pushHour}:00</div>
      <div class="noti"><b>잼통 · 🫙 잼통이가 기다려요</b><span>${body}</span></div>
      <div class="noti"><b>잼통 · 🌼 이번 주 돌아보기</b><span>근거 9장을 익혔어요 (일요일에만)</span></div>
    </div>
    <p class="small" style="margin:0">하루에 한 번이 최대예요. 목표를 채운 날은 오지 않아요. 언제든 내 기록 → 설정에서 끌 수 있어요.</p>
    ${preview ? `<button class="btn btn-line" type="button" data-act="sheetClose">닫기</button>` :
      `<div class="row"><button class="btn btn-line" type="button" data-act="sheetClose" style="flex:1">나중에</button><button class="btn btn-jam" type="button" data-act="pushYes" style="flex:1">알려 주세요</button></div>`}
  </div>`;
  $("#phone").appendChild(w);
}

function unitSheet(i) {
  const n = PATH[i];
  const done = { fruit: 5, bloom: 4, sprout: 2, now: 3 }[n.s] ?? 0;
  const steps = [["🌱", "알기"], ["🌿", "이해"], ["🔍", "출처"], ["⚖️", "반론"], ["💬", "말하기"]];
  const w = document.createElement("div"); w.className = "sheet-wrap"; w.id = "sheet";
  w.innerHTML = `<div class="sheet" role="dialog" aria-label="${esc(n.t)}">
    <div class="eyebrow">업적의 길 · 단원</div><div class="h">${esc(n.t)}</div>
    <div class="steps5">${steps.map(([e, l], k) => `<div class="${k < done ? "doneS" : k === done ? "nowS" : ""}">${e} ${l}<span class="st">${k < done ? "마침" : k === done ? "다음" : "잠김"}</span></div>`).join("")}</div>
    <div class="row"><a class="link" href="#" data-noop>원본 업적 페이지 보기</a></div>
    <div class="row"><button class="btn btn-line" type="button" data-act="sheetClose" style="flex:1">닫기</button>${done < 5 ? `<button class="btn btn-jam" type="button" data-act="lessonFromSheet" style="flex:1">${steps[done][1]} 시작</button>` : `<button class="btn btn-jam" type="button" data-act="explainFromSheet" style="flex:1">30초 설명하기</button>`}</div>
  </div>`;
  $("#phone").appendChild(w);
}

let timerId = null;
function runTimer() {
  const el = $("#timer"); if (!el) return;
  clearInterval(timerId); let s = 30; el.textContent = "0:30";
  timerId = setInterval(() => { s--; const t = $("#timer"); if (!t || s < 0) { clearInterval(timerId); return; } t.textContent = `0:${String(s).padStart(2, "0")}`; if (s === 0) toast("시간 끝! 아래 네 칸을 짚어 보세요"); }, 1000);
}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("복사했어요"); }
  catch (e) { toast("복사가 막혔어요. 길게 눌러 선택하세요"); }
}

/* ───────── 이벤트 ───────── */
document.addEventListener("click", (e) => {
  const t = e.target.closest("button, a"); if (!t) return;
  const d = t.dataset;
  if (d.noop !== undefined) { e.preventDefault(); toast("시안에서는 원본 페이지로 가지 않아요"); return; }
  if (d.tab) return go(d.tab);
  if (d.seg) { state.seg = d.seg; try { localStorage.setItem("jt-study-tab", state.tab + ":" + state.seg); } catch (er) {} render(); return; }
  if (d.go) { const [a, b] = d.go.split(":"); return go(a, b); }
  if (d.course) { state.course = +d.course; return render(); }
  if (d.unit) return unitSheet(+d.unit);
  if (d.pick) { const i = state.picks.indexOf(d.pick); i >= 0 ? state.picks.splice(i, 1) : state.picks.length < 3 ? state.picks.push(d.pick) : toast("3장까지 고를 수 있어요"); return render(); }
  if (d.copy) { const c = WALLET[+d.copy]; return copy(`${c.text}\n출처: jamtong.kr (${c.a})`); }
  if (d.goal) { state.goal = +d.goal; return render(); }
  if (d.hour) { state.pushHour = +d.hour; return render(); }
  if (d.opt !== undefined && L && !L.checked) { L.sel = +d.opt; return drawLesson(); }
  switch (d.act) {
    case "lesson": return openLesson();
    case "quit": return closeLesson();
    case "check": { const q = LESSON[L.i]; L.checked = true; if (L.sel === q.answer) { L.right++; L.combo++; } else L.combo = 0; return drawLesson(); }
    case "next": L.i++; L.sel = null; L.checked = false; return drawLesson();
    case "afterDone": closeLesson(); if (!state.pushOn) pushSheet(false); return;
    case "pushYes": state.pushOn = true; $("#sheet")?.remove(); toast(`매일 ${state.pushHour}시에 알려 드릴게요`); return render();
    case "sheetClose": $("#sheet")?.remove(); return;
    case "lessonFromSheet": $("#sheet")?.remove(); return openLesson();
    case "explainFromSheet": $("#sheet")?.remove(); return go("talk", "explain");
    case "pushpreview": return pushSheet(true);
    case "push": state.pushOn = !state.pushOn; return render();
    case "neutral": state.neutral = !state.neutral; return render();
    case "compose": state.replyDone = true; return render();
    case "retry": state.replyDone = false; state.picks = []; return render();
    case "copy": { const lines = DIALOG.cards.filter(c => state.picks.includes(c.id) && c.role !== "off").map(c => c.say); return copy(lines.join(" ") + `\n근거: https://${DIALOG.link}`); }
    case "timer": return runTimer();
    case "ask": { const v = ($("#ask")?.value || "").trim(); return toast(v ? "시안에서는 답하지 않아요 · 실제로는 위키 AI 질문으로" : "물어볼 것을 적어 주세요"); }
    case "garden": return toast("정원(/garden)으로 갑니다");
  }
  if (t.id === "exitBtn") toast("사이트 홈으로 돌아갑니다");
});
document.addEventListener("input", (e) => {
  if (e.target.id !== "q") return;
  const v = e.target.value.trim();
  const list = $("#wallet"); if (!list) return;
  list.innerHTML = WALLET.map((c, i) => [c, i]).filter(([c]) => !v || (c.text + c.unit).includes(v)).map(([c, i]) => evCard(c, `<div class="row"><button class="btn btn-line" type="button" data-copy="${i}" style="padding:5px 10px;font-size:12px">복사</button><a class="link" href="#" data-noop>원문 보기</a></div>`)).join("") || `<p class="small">맞는 카드가 없어요.</p>`;
});

render();
</script>
